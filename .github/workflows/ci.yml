name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

# A new push supersedes whatever is still running for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The Windows-only tools (installers, Windows Sandbox) keep their decisions in functions the
    # tests call on any platform; what they drive needs a built app, which a runner does not have.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The guard reads commit messages too.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # Matches the `engines` floor in package.json.
          node-version: 22
      - run: npm test
      - run: npm run guard
